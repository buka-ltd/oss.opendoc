name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  pullRequest:
    name: pullRequest
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.result.outputs.released }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - uses: pnpm/action-setup@v4
      - name: Install Dependencies
        run: pnpm install -w
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          title: "Release"
          commit: "Release"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - id: result
        run: |
          RELEASED=$([ "${{ steps.changesets.outputs.hasChangesets }}" = 'false' ] && { [ "${{ github.event.head_commit.message }}" = 'Release' ] || [ "${{ github.event_name }}" = 'workflow_dispatch' ]; } && echo true || echo false)
          echo "released=$RELEASED" >> $GITHUB_OUTPUT

  createTags:
    name: Create Tags
    needs: pullRequest
    runs-on: ubuntu-latest
    if: ${{ needs.pullRequest.outputs.released == 'true' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - uses: pnpm/action-setup@v4
      - name: Install Dependencies
        run: pnpm install -w
      - name: Set Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@github.com"
      - name: Create Tag
        run: pnpm changeset tag
      - name: Push Tag
        run: |
          REMOTE_TAGS=$(git ls-remote --refs -t | awk '{print $2}' | awk -F '/' '{print $3}')
          LOCAL_TAGS=$(git tag -l)
          TAGS="$REMOTE_TAGS $REMOTE_TAGS $LOCAL_TAGS"
          echo $TAGS | xargs -n1 | sort | uniq -u | xargs -n1
          echo $TAGS | xargs -n1 | sort | uniq -u | xargs -n1 git push origin

  publishToNpm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: pullRequest
    if: ${{ needs.pullRequest.outputs.released == 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org/
          node-version-file: ".node-version"
      - uses: pnpm/action-setup@v4
      - name: Install Dependencies
        run: pnpm install
      - name: Build Packages
        run: pnpm run build:pkg
      - name: Debug auth env
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" -H "Accept: application/json" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm%3Aregistry.npmjs.org" | jq -r .value)
          echo "ID token acquired: ${ID_TOKEN:+yes}"
          echo "--- token exchange response ---"
          curl -s -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@opendoc%2Furi-template" \
            -H "Authorization: Bearer $ID_TOKEN" -H "Content-Type: application/json" -w "\nHTTP %{http_code}\n"
      - name: Publish Packages
        env:
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_LOGLEVEL: verbose
        run: pnpm --filter @opendoc/uri-template publish --provenance --access=public

  buildBackendApplication:
    name: "Build Backend Application"
    runs-on: ubuntu-latest
    needs: pullRequest
    if: ${{ needs.pullRequest.outputs.released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/backend/dockerfile
          push: true
          tags: ghcr.io/buka-lnc/opendoc-backend:latest

  buildFrontendApplication:
    name: "Build Frontend Application"
    runs-on: ubuntu-latest
    needs: pullRequest
    if: ${{ needs.pullRequest.outputs.released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/frontend/dockerfile
          push: true
          tags: ghcr.io/buka-lnc/opendoc-frontend:latest

  buildCompilerApplication:
    name: "Build Compiler Application"
    runs-on: ubuntu-latest
    needs: pullRequest
    if: ${{ needs.pullRequest.outputs.released == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/compiler/dockerfile
          push: true
          tags: ghcr.io/buka-lnc/opendoc-compiler:latest
